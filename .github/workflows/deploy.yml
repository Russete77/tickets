name: Deploy

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =============================================================
  # Docker image API → GHCR
  # =============================================================
  docker-api:
    name: Build & push API image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./ticketeria-api/Dockerfile
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================
  # Web → Cloudflare Pages
  # =============================================================
  web-deploy:
    name: Deploy web → Cloudflare Pages
    runs-on: ubuntu-22.04
    # Skip se secrets Cloudflare não configurados (gate para evitar falha automática)
    if: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build:types
      - run: npm run build:web
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy ticketeria-web/dist --project-name=pulsepass-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # =============================================================
  # Mobile EAS Build (apenas em tags vX.Y.Z)
  # =============================================================
  mobile-eas:
    name: Mobile EAS submit
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci -w ticketeria-mobile
      - name: EAS build
        working-directory: ticketeria-mobile
        run: |
          npm i -g eas-cli
          eas build --non-interactive --platform all --profile production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
